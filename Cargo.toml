[workspace]
members = [
    "apps/termglide",
    "crates/tg-browser",
    "crates/tg-config",
    "crates/tg-core",
    "crates/tg-network",
    "crates/tg-platform",
    "crates/tg-terminal",
    "crates/tg-url",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
authors = ["TermGlide contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DAWNCR0W/TermGlide"

[workspace.dependencies]
base64 = "0.22.1"
bitflags = { version = "2.10.0", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.31"
png = "0.18.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.test]
opt-level = 1
