name: Bug report
description: Report a reproducible problem in TermGlide.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove credentials, cookies, tokens,
        private URLs, and personal data from everything you share.
  - type: input
    id: version
    attributes:
      label: TermGlide version
      description: Provide a release version or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, terminal, and Chrome or Chromium version.
      placeholder: macOS 15, Terminal.app, Chrome 151
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant `termglide doctor` output or logs after removing private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, cookies, tokens, private URLs, and personal data.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
