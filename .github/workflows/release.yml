name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build (${{ matrix.dist }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: linux-x86_64
            ext: tar.gz
          - os: macos-latest
            dist: macos-aarch64
            ext: tar.gz
          - os: windows-latest
            dist: windows-x86_64
            ext: zip
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.92.0
      - name: Build release binary
        run: cargo build --locked --release -p termglide
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          archive="termglide-${{ matrix.dist }}.${{ matrix.ext }}"
          tar -czf "$archive" -C target/release termglide
          sha256sum "$archive" > SHA256SUMS
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "termglide-${{ matrix.dist }}.${{ matrix.ext }}"
          Compress-Archive -Path "target/release/termglide.exe" -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 $archive).Hash + "  " + $archive | Out-File -Encoding ascii SHA256SUMS
      - name: Attach binaries to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            termglide-${{ matrix.dist }}.${{ matrix.ext }}
            SHA256SUMS
