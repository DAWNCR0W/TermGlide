[package]
name = "termglide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A graphical web browser for the terminal, powered by isolated Chrome and CDP"
readme = "../../README.md"
keywords = ["browser", "terminal", "chromium", "tui"]
